# Zone A. Every value that differs per environment comes from env vars set in compose.yml.
spring:
  application:
    name: filegrid-api
  task:
    scheduling:
      # Health probes, spool replay and upload cleanup must not wait on each other.
      pool:
        size: 4
  threads:
    virtual:
      enabled: true   # blocking I/O (JDBC, FTP, S3) without thread-pool starvation
  datasource:
    url: ${PG_URL:jdbc:postgresql://postgres:5432/filegrid}
    username: ${PG_USER:filegrid}
    password: ${PG_PASSWORD:}
    hikari:
      # A stopped database must fail in seconds so the circuit breaker can open and the spool
      # can take over, instead of every request waiting for the 30 s default.
      connection-timeout: 3000
      # Must cover the workers of every category that writes to the database at once (16 + 8 + 4 + 2 by default),
      # plus the background jobs. A smaller pool would let one category's storm starve the others of connections.
      maximum-pool-size: 32
      data-source-properties:
        connectTimeout: 3
  flyway:
    locations: classpath:db/migration
  web:
    resources:
      # An API has no static files. With this on, a POST to an unknown route is a 405 from
      # the resource handler instead of a 404, and a GET leaned on the 500 catch-all.
      add-mappings: false
  servlet:
    multipart:
      # Outage/document cap at 20 MB in policy; leave headroom for multipart overhead.
      # Video goes through the streaming tus endpoint (P1), not multipart.
      max-file-size: 64MB
      max-request-size: 65MB

server:
  port: 8080
  shutdown: graceful

filegrid:
  version: 0.1.0
  otel:
    # Same collector as the traces (OTEL_EXPORTER_OTLP_ENDPOINT), path /v1/logs.
    logs-endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4318}/v1/logs
  spool:
    # A volume in compose, so parked files survive a container restart.
    dir: ${FILEGRID_SPOOL_DIR:/var/filegrid/spool}
  policy-file: ${FILEGRID_POLICY_FILE:/config/policy.yaml}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4318}/v1/traces

logging:
  structured:
    format:
      console: ecs   # JSON logs with trace ids, ready for Loki
    json:
      rename:
        # The names in contracts/metrics.md. category, storage and file_id are added to the log context by
        # ro.ppc.filegrid.observability.Spans while a span is open.
        traceId: trace_id
        spanId: span_id
