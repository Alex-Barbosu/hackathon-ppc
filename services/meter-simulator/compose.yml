# Zone B. Points at the mock API in the base; switch TARGET_URL to
# http://filegrid-api:8080/api/v1/meter-readings once zone A ships ingest.
services:
  meter-simulator:
    build: .
    environment:
      TARGET_URL: ${METER_TARGET_URL:-http://mock-api:4010/api/v1/meter-readings}
      READINGS_PER_SEC: ${METER_READINGS_PER_SEC:-1}
      METER_DEVICE_TOKEN: ${METER_DEVICE_TOKEN:?run make up to generate .env}
    networks: [app]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:9100/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
