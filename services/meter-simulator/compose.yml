# Zone B. Sends to the real ingest API. To build against the Prism mock instead, set in .env:
#   METER_TARGET_URL=http://mock-api:4010/api/v1/meter-readings
# Rate changes live without a restart: POST http://meter-simulator:9100/rate (internal only).
services:
  meter-simulator:
    build: .
    environment:
      METER_TARGET_URL: ${METER_TARGET_URL:-http://caddy:8088/api/v1/meter-readings}
      METER_DEVICE_TOKEN: ${METER_DEVICE_TOKEN:?run make up to generate .env}
      METER_COUNT: ${METER_COUNT:-500}
      READINGS_PER_SEC: ${METER_READINGS_PER_SEC:-1}
      METER_PROFILE: ${METER_PROFILE:-normal}
    volumes:
      # Clock and unacked readings survive restarts, so a rebuild never re-reports a period
      # under a new key (see docs/b.md, "Meter simulator").
      - meter-sim-data:/data
    networks: [app]
    depends_on:
      # Not required for correctness (readings wait and retry), but avoids a burst of
      # retries on every cold start while the API boots.
      filegrid-api: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:9100/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  meter-sim-data: {}
