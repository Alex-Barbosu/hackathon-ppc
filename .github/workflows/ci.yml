name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  zone-guard:
    # Keeps the three AI-driven zones from editing each other's files.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: One zone per PR
        run: node scripts/zone-guard.mjs "origin/${{ github.base_ref }}" '${{ toJson(github.event.pull_request.labels.*.name) }}'

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Lint OpenAPI
        run: npx --yes @redocly/cli@1 lint contracts/openapi.yaml --skip-rule=operation-4xx-response --skip-rule=no-server-example.com --skip-rule=info-license
      - name: Policy validates against schema
        run: |
          npx --yes js-yaml@4 config/policy.yaml > "$RUNNER_TEMP/policy.json"
          npx --yes ajv-cli@5 validate --spec=draft2020 -s contracts/policy.schema.json -d "$RUNNER_TEMP/policy.json"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: maven }
      - run: mvn -B -q verify
        working-directory: services/filegrid-api

  node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [services/meter-simulator, services/chaos-control, services/insights, apps/web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci && npm run build
        working-directory: ${{ matrix.dir }}

  stack:
    # The judges' path: fresh clone -> make up -> everything healthy.
    runs-on: ubuntu-latest
    needs: [api, node]
    steps:
      - uses: actions/checkout@v4
      - name: make up
        run: make up
      - name: Gateway routes answer
        run: |
          for path in /api/v1/health /insights/health /chaos/state /mock/api/v1/health /grafana/api/health /; do
            code=$(curl -sk -o /dev/null -w '%{http_code}' "https://localhost$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || exit 1
          done
      - name: Storages are not published
        run: |
          for port in 5432 8333 9333 21; do
            if nc -z -w 2 localhost $port; then echo "port $port is reachable from the host"; exit 1; fi
          done
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=80
