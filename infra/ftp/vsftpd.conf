# Zone B. One local user (filegrid), FTPS only, passive mode on a fixed port range.
listen=YES
listen_ipv6=NO
background=NO
seccomp_sandbox=NO
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022
# The user is jailed in its home; FileGrid's object keys are relative to it.
chroot_local_user=YES
allow_writeable_chroot=YES
# The account has no login shell; pam-filegrid checks the password only.
check_shell=NO
pam_service_name=vsftpd-filegrid
secure_chroot_dir=/var/run/vsftpd/empty
pasv_enable=YES
pasv_min_port=30000
pasv_max_port=30009
# Data connections must come from the same IP as the control connection.
pasv_promiscuous=NO
max_clients=50
max_per_ip=50
# TLS is mandatory for logins and data: credentials and files never travel in clear text.
ssl_enable=YES
allow_anon_ssl=NO
force_local_logins_ssl=YES
force_local_data_ssl=YES
ssl_tlsv1=NO
ssl_sslv2=NO
ssl_sslv3=NO
ssl_ciphers=HIGH
rsa_cert_file=/etc/vsftpd/tls/cert.pem
rsa_private_key_file=/etc/vsftpd/tls/key.pem
# Java's FTPSClient (filegrid-api, Apache Commons Net) does not resume the control
# connection's TLS session on the data connection; with reuse required the server resets
# every upload. The server is only reachable on the internal `data` network, and
# pasv_promiscuous=NO still ties each data connection to the control connection's IP.
require_ssl_reuse=NO
xferlog_enable=YES
xferlog_std_format=NO
vsftpd_log_file=/var/log/vsftpd.log
