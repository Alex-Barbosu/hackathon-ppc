# Zone B. Storages, gateway, chaos proxy, mock API and observability.
# Rule: only caddy (80/443) and toxiproxy's slow lane (8443) publish ports.
# Everything else is reachable only by service name on the internal networks.

networks:
  edge: {}            # public side: gateway + slow lane
  app: {}             # services, observability
  data:
    internal: true    # storages; no route to or from the outside world

volumes:
  pg-data: {}
  seaweed-data: {}
  ftp-data: {}
  caddy-data: {}
  caddy-config: {}
  prometheus-data: {}
  loki-data: {}
  tempo-data: {}
  grafana-data: {}

services:
  # ---------------------------------------------------------------- storages
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: filegrid
      POSTGRES_USER: filegrid
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run make up to generate .env}
      INSIGHTS_DB_PASSWORD: ${INSIGHTS_DB_PASSWORD:?run make up to generate .env}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filegrid -d filegrid"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  seaweedfs:
    image: chrislusf/seaweedfs:3.80
    entrypoint: ["/bin/sh", "/etc/seaweedfs/start.sh"]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?run make up to generate .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?run make up to generate .env}
    volumes:
      - seaweed-data:/data
      - ./seaweedfs/start.sh:/etc/seaweedfs/start.sh:ro
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/buckets-ready && wget -qO /dev/null http://127.0.0.1:8333/status"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  ftp:
    build: ./ftp
    # vsftpd must not be PID 1: it aborts when it reaps a process it did not start
    # (orphans re-parented to PID 1), which restarted the server after every download.
    init: true
    environment:
      FTP_USER_NAME: filegrid
      FTP_USER_PASS: ${FTP_PASSWORD:?run make up to generate .env}
      TLS_CN: ftp
    volumes:
      - ftp-data:/home/ftpusers
    networks: [data]
    healthcheck:
      # A 220 banner means vsftpd is accepting connections.
      test: ["CMD-SHELL", "echo QUIT | nc -w 2 127.0.0.1 21 | grep -q '^220'"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  # ------------------------------------------------------- gateway and chaos
  caddy:
    image: caddy:2.9-alpine
    # --watch reloads the Caddyfile when it changes (git pull, branch switch), because
    # `make up` does not recreate the container for a config file change.
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile", "--watch"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      FILEGRID_HOST: ${FILEGRID_HOST:-localhost}
      # Read by the Caddyfile's `tracing` directive (OTLP gRPC), so traces start at the gateway.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      OTEL_SERVICE_NAME: caddy
    volumes:
      # The directory, not the file: a single-file bind mount pins the inode, so a
      # `git switch` or editor save would leave Caddy on the old Caddyfile.
      - ./caddy:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge, app]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:2019/config/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.11.0
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    # Scratch image, no shell: its own CLI asks the API, which answers once the seed loaded.
    healthcheck:
      test: ["CMD", "/toxiproxy-cli", "list"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "8443:8443"   # slow lane: https://localhost:8443 = the gateway through degradable network
    volumes:
      # The directory, not the file: a single-file bind mount pins the inode, so after a
      # `git pull` that adds proxies the container would still read the old seed.
      - ./toxiproxy:/config:ro
    networks: [edge, app, data]
    restart: unless-stopped

  mock-api:
    # Prism mock of contracts/openapi.yaml, served at https://<host>/mock/...
    image: stoplight/prism:5.15.10
    # -m false: the multi-process mode crashes on the Node 24 base image.
    command: ["mock", "-h", "0.0.0.0", "-p", "4010", "-m", "false", "--dynamic=false", "/contracts/openapi.yaml"]
    volumes:
      - ../contracts:/contracts:ro
    networks: [app]
    healthcheck:
      # A real contract route: healthy means the OpenAPI file was parsed, not just a port open.
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:4010/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # ------------------------------------------------------------------- load
  # k6, started only on demand: `make b-load S=<scenario>` (profile "load", so `make up`
  # never starts it). It joins the gateway's network namespace, so https://localhost is
  # Caddy itself: TLS, routing and auth exactly as a browser sees them. Results are pushed
  # to Prometheus (remote write) as k6_* metrics.
  k6:
    image: grafana/k6:0.57.0
    profiles: [load]
    network_mode: "service:caddy"
    environment: &k6-env
      DEMO_PASSWORD: ${DEMO_PASSWORD:?run make up to generate .env}
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_STATS: "p(50),p(95),p(99),max"
      K6_NO_USAGE_REPORT: "true"
    volumes:
      - ../loadtest:/scripts:ro
    working_dir: /scripts
  # Same, through the slow lane: https://localhost:8443 is Toxiproxy's client_slowlane, the
  # path /chaos/network degrades. For lossy-link scenarios (video-lossy.js).
  k6-slowlane:
    image: grafana/k6:0.57.0
    profiles: [load]
    network_mode: "service:toxiproxy"
    environment:
      <<: *k6-env
      BASE_URL: https://localhost:8443
      # Chaos calls bypass the degraded lane, so healing the link cannot itself be lost.
      CHAOS_URL: http://chaos-control:8090
    volumes:
      - ../loadtest:/scripts:ro
    working_dir: /scripts
  # ------------------------------------------------------------ observability
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel/config.yaml:/etc/otelcol/config.yaml:ro
    networks: [app]
    depends_on: [tempo, loki]
    # No Docker healthcheck: the image is scratch (no shell, no HTTP client), so a check could
    # only prove the binary exists. Prometheus scrapes it (job otel-collector) and ServiceDown
    # fires within 30 s if it stops; make fresh-test checks every target is up.
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=3d
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    networks: [app]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.28.0
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks: [app]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:9093/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  loki:
    image: grafana/loki:3.3.2
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - loki-data:/loki
    networks: [app]
    healthcheck:
      # /ready answers 503 for 15 s after the ingester joins its ring (min_ready_duration),
      # counted from the first /ready call, hence the start period.
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:3100/ready"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 30
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.6.1
    user: "0"   # writes to a named volume; the image's default user cannot
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    networks: [app]
    healthcheck:
      # Same 15 s ingester wait as Loki's.
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:3200/ready"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 30
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?run make up to generate .env}
      GF_SERVER_ROOT_URL: https://${FILEGRID_HOST:-localhost}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      # Lets a viewer open Explore, where exemplar and trace links land. Viewers still cannot
      # save dashboards or change datasources; the data behind them is metrics, traces and
      # logs that carry no personal data (root CLAUDE.md rule 8).
      GF_USERS_VIEWERS_CAN_EDIT: "true"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_FEATURE_TOGGLES_ENABLE: traceToLogs
      # https://<host>/grafana/ opens straight on FileGrid Overview.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/overview.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks: [app]
    depends_on: [prometheus, loki, tempo]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
