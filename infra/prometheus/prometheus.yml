# Zone B. Scrape targets resolve through Docker DNS, so every replica of a scaled
# service is scraped automatically.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: filegrid-api
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: [filegrid-api]
        type: A
        port: 8080

  - job_name: meter-simulator
    dns_sd_configs:
      - names: [meter-simulator]
        type: A
        port: 9100

  - job_name: chaos-control
    static_configs:
      - targets: ["chaos-control:8090"]

  - job_name: insights
    metrics_path: /insights/metrics
    static_configs:
      - targets: ["insights:8070"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
